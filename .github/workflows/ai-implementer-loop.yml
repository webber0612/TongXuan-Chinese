name: AI Implementer Loop

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub Phase Work Order issue number
        required: true
        type: string
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]

concurrency:
  group: ai-implementer-${{ github.event.issue.number || github.event.pull_request.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  implement:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'issues' && github.event.label.name == 'phase-ready' && github.event.issue.user.login == github.repository_owner) ||
      (github.event_name == 'pull_request' && github.event.label.name == 'audit-changes-requested' && github.event.pull_request.draft == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install test dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          npm ci --prefix frontend
      - name: Run Implementer
        uses: openai/codex-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
          WORK_ORDER_ISSUE: ${{ inputs.issue_number || github.event.issue.number || github.event.pull_request.number }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          prompt: |
            Read .github/codex/prompts/implementer.md and follow it exactly.
            Repository: ${{ github.repository }}.
            Work-order or audit PR number: ${{ inputs.issue_number || github.event.issue.number || github.event.pull_request.number }}.
            Use GH_TOKEN and GitHub CLI/API to read the active Issue and PR comments.
            Implement only the current Phase, run complete tests/build, update required docs,
            and create/update a Draft PR. Push the branch so Architect can audit it.
            Never merge, mark Ready, or start the next Phase.
