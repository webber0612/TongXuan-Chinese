services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      TONGXUAN_ENV: production
      TONGXUAN_DB_PATH: /app/data/tongxuan.sqlite3
      TONGXUAN_BACKUP_DIR: /app/backups
      TONGXUAN_ALLOWED_ORIGINS: ${TONGXUAN_ALLOWED_ORIGINS:?set approved HTTPS origin}
      TONGXUAN_AUTH_SECRET: ${TONGXUAN_AUTH_SECRET:?set secret in NAS secret manager}
      BUILD_TARGET: family
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/readiness', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
